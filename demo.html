<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>louisHM 独立桌宠组件</title><style>body{margin:0;background:radial-gradient(ellipse at 70% 60%,#3e3455,#181c2c);color:#ece6f2;font:16px/1.8 system-ui;min-height:100vh}main{max-width:620px;padding:7vw}button{margin:5px;padding:10px 18px;border:1px solid #b8a5cd66;border-radius:12px;background:#665273;color:white;cursor:pointer}output{display:block;color:#ddd0ec}small{color:#beb3cd}</style><main><h1>独立桌宠</h1><p>点击桌宠打开自定义菜单；拖动体验正式动作。此页面不含手机、笔记或其他游戏窗口。</p><button id="switch">切换人物</button><button id="menu">替换菜单</button><button id="destroy">销毁组件</button><button id="mount">重新创建</button><output id="status">加载中…</output><small>louisHM · 当前正式动画 / 独立回调菜单</small></main><script type="module">
import {createDesktopPet} from './index.mjs';
const status=document.querySelector('#status');let pet;
function mount(){if(pet)return;pet=createDesktopPet({storageKey:'louisHM-component-demo',menu:[{id:'notes',label:'我的笔记',iconText:'✎',onClick:()=>status.textContent='收到回调：我的笔记（组件没有内置窗口）'},{id:'custom',label:'自定功能',iconText:'☆',onClick:()=>status.textContent='收到回调：自定功能'},{id:'switch',label:'换人',iconText:'↔'}],onCharacter:role=>status.textContent='当前人物：'+role});pet.ready.then(()=>status.textContent='桌宠已就绪').catch(e=>status.textContent='加载失败：'+e.message);}
document.querySelector('#switch').onclick=()=>pet?.switchCharacter();document.querySelector('#menu').onclick=()=>{pet?.setMenu([{id:'hello',label:'打招呼',iconText:'♡',onClick:()=>status.textContent='新菜单回调成功'},{id:'switch',label:'换一个',iconText:'↔'}],{radius:90,startAngle:-120});status.textContent='菜单已替换，点击桌宠查看';};document.querySelector('#destroy').onclick=()=>{pet?.destroy();pet=null;status.textContent='组件已销毁';};document.querySelector('#mount').onclick=mount;mount();
</script></html>
