<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HypnoOS · 地点场景与随身收藏</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151a23;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#scene{position:absolute;inset:0}.game-phone-toggle{position:absolute;right:22px;bottom:24px;z-index:10;color:#f4e9fa;border:1px solid #c3abd177;border-radius:17px;background:#2c1c3dcc;padding:13px 20px;font:13px inherit;cursor:pointer;backdrop-filter:blur(10px)}#phone-window{position:absolute;left:var(--hypno-scene-center-x,50%);top:var(--hypno-scene-center-y,50%);transform:translate(-50%,-50%);width:min(430px,calc(var(--hypno-scene-height,100vh)*.90 * .4712),calc(var(--hypno-scene-width,100vw)*.8));height:min(910px,calc(var(--hypno-scene-height,100vh)*.90));z-index:20;pointer-events:none}#phone-window[hidden]{display:none}#phone{position:absolute;inset:0;pointer-events:auto}.game-phone-close{position:absolute;top:0;right:-25px;width:32px;height:32px;background:#453650;color:#fff;border:1px solid #c3a6d977;border-radius:50%;cursor:pointer;pointer-events:auto;z-index:30}.game-window{position:fixed;inset:0;z-index:2147483200;pointer-events:none;background:transparent}.game-locations{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,90vw);height:min(650px,86vh);background:#211a2b;border:1px solid #af91635c;border-radius:21px;padding:22px;color:#e8dcec;box-sizing:border-box;pointer-events:auto;box-shadow:0 25px 100px #0006}.game-locations header{display:flex;justify-content:space-between;height:39px;margin-bottom:15px;align-items:center}.game-locations h2{margin:0;font-size:21px;font-weight:500}.game-locations header button{background:#49374f;color:#eee;border:0;border-radius:50%;width:32px;height:32px;font-size:20px;cursor:pointer}.game-locations>main{height:calc(100% - 54px);overflow:hidden}.game-phone-drag{position:absolute;left:35%;right:35%;top:-22px;text-align:center;color:#e4d5ee;font:24px/20px system-ui;pointer-events:auto;user-select:none}#phone-window[data-orientation=landscape]{width:min(910px,calc(var(--hypno-scene-width,100vw)*.90),calc(var(--hypno-scene-height,100vh)*.90 * 2.116));height:min(430px,calc(var(--hypno-scene-width,100vw)*.90 / 2.116),calc(var(--hypno-scene-height,100vh)*.90))}.game-phone-toolbar{position:absolute;left:0;right:0;top:-30px;display:flex;align-items:center;justify-content:space-between;color:#e8ddec;font:13px system-ui;pointer-events:auto}.game-phone-toolbar button{background:#453650;border:0;color:#fff;border-radius:8px;padding:5px 9px;cursor:pointer}</style></head><body><main id="scene"></main><section id="phone-window" class="floating-surface" hidden><button class="game-phone-close" aria-label="收起手机">×</button><main id="phone"></main></section><script type="module" src="./character-content-policy.js"></script><script type="module" src="./game-scene.bundle.mjs"></script></body></html>
